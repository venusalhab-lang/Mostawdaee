name: Signed AAB Builder
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Type-check, test and build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  aab:
    name: Build signed AAB
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Required repository secrets (Settings > Secrets and variables > Actions):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      #   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_API_BASE_URL
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Require the phone API origin
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL is empty. The installed app could not reach the server for subscriptions and the assistant."
            exit 1
          fi
      - name: Build web app
        run: npm run build
      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. A persistent upload key is required (a new key every build is rejected by Google Play)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/release.keystore

      - name: Build signed AAB
        working-directory: android
        run: ./gradlew clean bundleRelease --no-daemon -PversionCode=$((100 + ${{ github.run_number }}))

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Mostawdaee-Signed-Bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
